name: Deploy Dealyva to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      AWIN_ACCESS_TOKEN: ${{ secrets.AWIN_ACCESS_TOKEN }}
      AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
      VITE_ADSENSE_CLIENT_ID: ${{ vars.ADSENSE_CLIENT_ID }}
      VITE_ADSENSE_SLOT_HOME_TOP: ${{ vars.ADSENSE_SLOT_HOME_TOP }}
      VITE_ADSENSE_SLOT_HOME_INLINE: ${{ vars.ADSENSE_SLOT_HOME_INLINE }}
      VITE_ADSENSE_SLOT_DETAIL: ${{ vars.ADSENSE_SLOT_DETAIL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Synchronize approved Awin offers
        if: ${{ env.AWIN_ACCESS_TOKEN != '' && env.AWIN_PUBLISHER_ID != '' }}
        run: npm run awin:sync

      - name: Build static site
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
